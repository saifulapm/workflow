[package]
name = "hubweb"
version = "0.1.0"
edition = "2024"

# cdylib is what worker-build turns into the Worker's wasm; rlib lets
# `cargo test` on the host build the page and stage code without a Worker.
[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# The hub's pages, which this Worker draws from the store.
hubpages = { path = "../hubpages" }
serde_json = "1.0.151"
# memview reads item frontmatter and its timestamps. No time zone data: every
# date mem prints is UTC, and the tz features do not build for wasm.
jiff = { version = "0.2.35", default-features = false, features = ["std"] }
# mem's items are TOML frontmatter; the same crate mem writes them with.
toml = "1.1.4"

# The Worker runtime only builds for wasm. Everything the host tests touch
# lives outside it, so `cargo test` never compiles the bindings.
[target.'cfg(target_arch = "wasm32")'.dependencies]
worker = "0.8.7"
# WebCrypto checks the Access JWT's RS256 signature, so no RSA code ships in
# the wasm. worker already depends on web-sys; these add the crypto bindings.
web-sys = { version = "0.3.106", features = ["Crypto", "CryptoKey", "SubtleCrypto"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
